name = "anatomia-submissions"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Firebase project id - the same value as `projectId` in google-services.json.
# Not a secret: it is only used to check that an incoming ID token was minted
# for THIS project (aud/iss), and as the Firestore REST project path.
[vars]
FIREBASE_PROJECT_ID = "anatomia-46a5a"

# R2 bucket holding the submitted files. The binding is what gives the Worker
# access - no access key id or secret exists anywhere, which is why Unity can
# never be given one.
[[r2_buckets]]
binding = "SUBMISSIONS_BUCKET"
bucket_name = "anatomia-submissions"
preview_bucket_name = "anatomia-submissions-dev"
